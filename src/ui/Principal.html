<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Wison IDE - Analizador LL(1)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .editor {
            font-family: 'Courier New', monospace;
            height: 300px;
            resize: none;
        }

        /* Contenedor del Árbol con Scroll */
        #tree-container {
            border: 1px solid #ccc;
            height: 500px;
            width: 100%;
            overflow: auto;
            background: #fff;
            position: relative;
        }

        #tree-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        #tree-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        #tree-canvas {
            display: inline-block;
            min-width: 100%;
        }

        .error-log {
            min-height: 100px;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }

        .table-container {
            height: 500px;
            overflow: auto;
        }

        .sticky-header th {
            position: sticky;
            top: 0;
            background: #212529;
            color: white;
            z-index: 10;
        }

        .table-prediccion {
            font-size: 0.85rem;
        }

        .link {
            fill: none;
            stroke: #4a90e2;
            stroke-width: 2px;
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <span class="navbar-brand mb-0 h1 mx-3">Generador de Analizadores Wison - Práctica 2</span>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Configuración del Analizador (Wison)</div>
                    <div class="card-body">
                        <textarea id="wison-editor" class="form-control editor"
                            placeholder="Wison¿ Lex {: ... :} Syntax {{: ... :}} ?Wison"></textarea>
                        
                        <div class="mt-3">
                            <button id="btn-generar" class="btn btn-primary">Generar Analizador</button>
                            <button class="btn btn-outline-secondary" onclick="document.getElementById('file-input').click()">Cargar Archivo</button>
                            <input type="file" id="file-input" class="d-none" onchange="cargarArchivo(event)">
                            <button id="btn-guardar" class="btn btn-outline-dark">Guardar Configuración</button>
                        </div>

                        <div class="mt-3 pt-3 border-top">
                            <label class="form-label fw-bold small text-muted text-uppercase">Historial de Análisis (Navegador):</label>
                            <div class="input-group">
                                <select id="select-historial" class="form-select">
                                    <option value="">-- Seleccionar guardado --</option>
                                </select>
                                <button id="btn-guardar-local" class="btn btn-warning" title="Guardar en navegador">Guardar</button>
                                <button id="btn-eliminar-local" class="btn btn-outline-danger" title="Eliminar seleccionado">Eliminar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">Probar Cadena de Entrada</div>
                    <div class="card-body">
                        <textarea id="input-editor" class="form-control editor"
                            placeholder="Ingrese la cadena a evaluar..."></textarea>
                        <div class="mt-3">
                            <button id="btn-evaluar" class="btn btn-success w-100" disabled>Evaluar Cadena</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="console" class="alert alert-secondary error-log mb-4">Esperando configuración...</div>
            </div>

            <div class="col-md-6">
                <h5>Árbol de Derivación</h5>
                <div id="tree-container" class="shadow-sm rounded">
                    <div id="tree-canvas" style="background: white;"></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark">
                        <ul class="nav nav-tabs card-header-tabs" id="tabAnalisis" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active text-uppercase fw-bold" id="simbolos-tab" data-bs-toggle="tab"
                                    data-bs-target="#panel-simbolos" type="button" role="tab">Tabla de Símbolos</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link text-uppercase fw-bold" id="prediccion-tab" data-bs-toggle="tab"
                                    data-bs-target="#panel-prediccion" type="button" role="tab">Tabla LL(1)</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-0">
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="panel-simbolos" role="tabpanel">
                                <div class="table-container">
                                    <table class="table table-hover table-sm mb-0">
                                        <thead class="table-dark sticky-header">
                                            <tr>
                                                <th>#</th>
                                                <th>Token</th>
                                                <th>Lexema</th>
                                                <th>Línea</th>
                                                <th>Col</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tabla-simbolos-body">
                                            <tr>
                                                <td colspan="5" class="text-center text-muted p-4">Analice una cadena para ver los resultados léxicos.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="panel-prediccion" role="tabpanel">
                                <div id="tabla-prediccion-container" class="table-container">
                                    <p class="text-muted p-4">La tabla se generará automáticamente al crear el analizador.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/src/parser/analizador.js"></script>
    <script type="module" src="/src/main.js"></script>

    <script>
        function cargarArchivo(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('wison-editor').value = e.target.result;
            };
            reader.readAsText(file);
        }
    </script>
</body>

</html>
